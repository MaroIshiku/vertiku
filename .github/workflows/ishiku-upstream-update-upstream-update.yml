name: ishiku upstream discovery

on:
  schedule:
    - cron: '0 5 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate declared upstream policy
        run: node .ishiku/kit/scripts/check-dependencies .
      - name: Publish discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-discovery-${{ github.run_id }}
          path: .ishiku/reports/
          retention-days: 30

# Dependency and generated-upstream changes are opened by each project's
# declared updater command. High-risk updates require review and never auto-merge.
