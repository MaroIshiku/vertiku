{
  "schema_version": 1,
  "application": { "id": "vertiku", "name": "Vertiku", "family": "ishiku", "locale": "en" },
  "summary": "A secure self-hosted file conversion hub, starting with a complete MP3-to-M4B audiobook workflow.",
  "requirements": [
    { "id": "PLAT-001", "title": "Operational health", "priority": "critical", "acceptance": ["Liveness and readiness endpoints reflect process, database, and storage health."], "security_critical": false },
    { "id": "AUTH-001", "title": "Revocable account session", "priority": "critical", "acceptance": ["The first administrator is created once using the configured setup secret.", "Passwords use Argon2id and invalid sign-ins return a generic error.", "Sessions are server-revocable and every authenticated mutation requires CSRF proof."], "security_critical": true },
    { "id": "AUTH-002", "title": "Compose-gated password recovery", "priority": "high", "acceptance": ["Password recovery is disabled by default and is exposed only when VERTIKU_PASSWORD_RESET is explicitly true.", "A reset requires the existing username, configured setup secret, and a new password; it preserves application data, revokes every session for the account, is rate-limited, audited without secrets, and can succeed only once per container start."], "security_critical": true },
    { "id": "UPLD-001", "title": "Private multi-file upload", "priority": "critical", "acceptance": ["An authenticated user can upload up to 500 supported local audio files with visible upload progress.", "Uploaded files are analyzed with ffprobe and stored under server-generated paths owned by that user."], "security_critical": true },
    { "id": "INPT-001", "title": "Mounted input library", "priority": "critical", "acceptance": ["Every folder under the read-only /input mount that directly contains supported audio is presented as a separate audiobook.", "Input browsing does not follow symlinks, never modifies or duplicates source files, and rejects paths outside the configured root."], "security_critical": true },
    { "id": "OUTP-001", "title": "Local and browser output", "priority": "critical", "acceptance": ["The default destination encodes and validates on the /output filesystem, then publishes without duplicating the result bytes or overwriting an existing file.", "A user can instead choose an authenticated browser download, while the single validated result remains in private /data storage."], "security_critical": true },
    { "id": "M4B-001", "title": "Natural chapter order and names", "priority": "critical", "acceptance": ["The default source order uses natural sorting so Part 2 precedes Part 10.", "Repeated book names in numbered source filenames are replaced with distinct Chapter N titles while meaningful filename titles remain unchanged."], "security_critical": false },
    { "id": "M4B-002", "title": "One file per chapter", "priority": "critical", "acceptance": ["Every active input file appears exactly once as a chapter in the generated M4B."], "security_critical": false },
    { "id": "M4B-003", "title": "Editable audiobook details", "priority": "high", "acceptance": ["Before conversion the user can change chapter order, chapter titles, title, author, narrator, year, genre, description, cover, and quality preset."], "security_critical": false },
    { "id": "M4B-004", "title": "Safe FFmpeg execution", "priority": "critical", "acceptance": ["FFmpeg and ffprobe run with argument arrays and shell execution disabled.", "No arbitrary command or engine argument is accepted from the browser."], "security_critical": true },
    { "id": "M4B-005", "title": "Validated M4B output", "priority": "critical", "acceptance": ["The result is checked for duration, chapter count, chapter titles, and title metadata before download is enabled."], "security_critical": false },
    { "id": "M4B-006", "title": "Embedded metadata and validated playback", "priority": "high", "acceptance": ["Existing embedded title, author, narrator, year, genre, description, and cover are reused when the user has not supplied an override; batch conversion never invents missing descriptive metadata.", "A native browser audio player becomes available only for an owner-authorized, completed, validated artifact and supports bounded byte-range streaming."], "security_critical": true },
    { "id": "JOBS-001", "title": "Persistent serial conversion queue", "priority": "high", "acceptance": ["Jobs enter a persistent FIFO queue that always processes exactly one audiobook at a time, with visible queue position and live progress.", "The jobs overview updates automatically without a page reload.", "Queued and running jobs can be cancelled, interrupted running jobs are requeued after restart, and terminal jobs remain visible in history."], "security_critical": false },
    { "id": "JOBS-002", "title": "Forecast and failure recovery", "priority": "high", "acceptance": ["The jobs view estimates remaining queue time and finish time, labels early estimates, and learns from completed conversions on the same account.", "A retryable failed job retains its source, does not block later jobs, preserves the failed attempt in history, and can be retried individually or with the owner-scoped retry-failed action; cancelled, successful, non-retryable, missing-source, or already-active jobs cannot be retried."], "security_critical": true },
    { "id": "JOBS-003", "title": "Observable conversion stages and complete queue ETA", "priority": "high", "acceptance": ["Job details show a persistent five-step checklist for queued, source inspection, output preparation, encoding, and validation/publication, with completed, current, pending, and stopped states conveyed without color alone.", "The running job shows its own remaining-time and finish estimate, while the jobs overview separately estimates completion of the running job plus every queued audiobook and explicitly labels the scope and confidence.", "The jobs overview groups failed jobs first, followed by the active job, queued jobs in queue order, and completed history; cancelled jobs remain available in a final stopped-history group."], "security_critical": false },
    { "id": "PREF-001", "title": "Review by exception preflight", "priority": "high", "acceptance": ["The mounted-input list uses source path metadata rather than full-file hashing to flag filename sequence gaps, suspiciously small files, already converted sources, active duplicates, and output-name collisions.", "Users can select all valid or only review-free books, stale source fingerprints are rejected server-side, estimated result size is checked against destination capacity before encoding, and no preflight action modifies /input."], "security_critical": true },
    { "id": "BATCH-001", "title": "Batch audiobook review", "priority": "high", "acceptance": ["The user can select any number of discovered /input audiobooks, review deterministic output names and chapter titles together, and enqueue the complete selection with one action without being required to enter missing descriptive metadata.", "Batch submission stores only references to read-only /input files, validates the exact server-side chapter set and fast source fingerprint, and continues unattended through the persistent serial queue."], "security_critical": true },
    { "id": "SEC-001", "title": "Owner-only artifacts", "priority": "critical", "acceptance": ["Drafts, jobs, and artifacts are looked up with the authenticated account ID and are not accessible to another account."], "security_critical": true },
    { "id": "DES-001", "title": "Accessible responsive interface", "priority": "high", "acceptance": ["The English interface supports keyboard operation, visible focus, 44 pixel targets, reduced motion, mobile navigation, desktop navigation, six themes, and light, dark, or system mode."], "security_critical": false },
    { "id": "SCOPE-001", "title": "Local conversion scope", "priority": "critical", "acceptance": ["Version 1 includes no yt-dlp, media URL input, remote import, DRM bypass, silence detection, transcription, online chapter lookup, or Pulliku dependency."], "security_critical": true },
    { "id": "OPS-001", "title": "Self-hosted container delivery", "priority": "high", "acceptance": ["Vertiku runs as a non-root Docker service with persistent data, a read-only root filesystem, dropped capabilities, a health check, and no Docker socket."], "security_critical": true }
  ]
}
