{
  "schema_version": 1,
  "kit_version": "1.0.1",
  "application": { "id": "vertiku", "name": "Vertiku", "family": "ishiku", "type": "web_application" },
  "platform": { "profile": "standard-webapp", "authentication": "standard-account", "design_system": "ishiku-design-1", "security_baseline": "level-2", "locale": "en" },
  "quality": { "default_risk_class": "C" },
  "updates": { "timezone": "Europe/Berlin", "weekly_schedule": { "day": "monday", "time": "05:00" } },
  "repository": { "default_branch": "main", "container_registry": "ghcr.io" },
  "verification": { "commands": [
    { "name": "application", "command": "npm ci && npm run check", "required_for_verified": true },
    { "name": "compose", "command": "docker compose --env-file .env.example config --quiet", "required_for_verified": true },
    { "name": "container", "command": "docker build --check . && docker build -t vertiku:verify .", "required_for_verified": true }
  ] },
  "upstreams": []
}
